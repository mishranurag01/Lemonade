<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pepperpotts Print Test</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: white; }
    body { font-family: Arial, sans-serif; }
    button { margin: 16px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <button type="button" id="print">Print</button>
  <script>
    document.getElementById('print').addEventListener('click', () => {
      // Open the original uploaded PDF, without recreating or altering its letterhead.
      window.open('./PurvaPhalguni%20Letterhead.pdf', '_blank', 'noopener');
    });
  </script>
</body>
</html>
